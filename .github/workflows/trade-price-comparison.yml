name: Materials comparison regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'business/**'
      - 'static/**'
      - 'templates/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/trade-price-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: materials-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          npm install --prefix "$RUNNER_TEMP/comparison-browser" playwright@1.56.1
          "$RUNNER_TEMP/comparison-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Full offline Python, Node and browser regression
        env:
          EMAIL_ENABLED: '0'
          GOOGLE_PLACES_API_KEY: ''
          OPENAI_API_KEY: ''
          ADVICE_EVIDENCE_DIR: '${{ runner.temp }}/advice-preview'
        run: |
          export CODEX_PRIMARY_RUNTIME_NODE_MODULES="$RUNNER_TEMP/comparison-browser/node_modules"
          export STAGE6_TEST_PYTHON="$(command -v python)"
          node --check static/app.js
          node --check static/city_account_prices.js
          node --check tests/run_local_browser.mjs
          node tests/test_lead_email.cjs
          python -B tests/run_stage6_local.py
      - name: Save approved article desktop and mobile previews
        uses: actions/upload-artifact@v4
        with:
          name: approved-advice-previews
          path: ${{ runner.temp }}/advice-preview
          if-no-files-found: error
      # Temporary Stage 3 validation aid: exports vendor-installed browser only.
      # Never upload the private article, application storage or credentials.
      - name: Package trusted Chromium for isolated private-content verification
        if: github.head_ref == 'growth/website-batch-8'
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, tarfile
          folders = list((Path.home() / '.cache/ms-playwright').glob('chromium_headless_shell-*'))
          assert len(folders) == 1
          with tarfile.open(Path(os.environ['RUNNER_TEMP']) / 'trusted-chromium.tar.gz', 'w:gz') as archive:
              archive.add(folders[0], arcname=folders[0].name)
          PY
      - name: Save trusted browser package
        if: github.head_ref == 'growth/website-batch-8'
        uses: actions/upload-artifact@v4
        with:
          name: batch8-trusted-chromium
          path: ${{ runner.temp }}/trusted-chromium.tar.gz
          if-no-files-found: error
