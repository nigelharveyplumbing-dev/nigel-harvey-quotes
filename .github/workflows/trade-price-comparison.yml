name: Materials comparison regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'business/**'
      - 'static/**'
      - 'templates/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/trade-price-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: materials-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          npm install --prefix "$RUNNER_TEMP/comparison-browser" playwright@1.56.1
          "$RUNNER_TEMP/comparison-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Full offline Python, Node and browser regression
        env:
          EMAIL_ENABLED: '0'
          GOOGLE_PLACES_API_KEY: ''
          OPENAI_API_KEY: ''
        run: |
          export CODEX_PRIMARY_RUNTIME_NODE_MODULES="$RUNNER_TEMP/comparison-browser/node_modules"
          export STAGE6_TEST_PYTHON="$(command -v python)"
          node --check static/app.js
          node --check tests/run_local_browser.mjs
          python -B tests/run_stage6_local.py
