name: Nigel Harvey Plumbing - Full Regression Tests

on:
  pull_request:
    branches: [main, feature/enquiry-source-revenue]
    paths:
      - 'app.py'
      - 'business/**'
      - 'static/**'
      - 'templates/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/full-regression-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          npm install --prefix "$RUNNER_TEMP/comparison-browser" playwright@1.56.1
          "$RUNNER_TEMP/comparison-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Secure document-link browser matrix
        env:
          EMAIL_ENABLED: '0'
          GOOGLE_PLACES_API_KEY: ''
          OPENAI_API_KEY: ''
          DOCUMENT_LINK_EVIDENCE_DIR: '${{ runner.temp }}/document-link-preview'
        run: |
          export CODEX_PRIMARY_RUNTIME_NODE_MODULES="$RUNNER_TEMP/comparison-browser/node_modules"
          export STAGE6_TEST_PYTHON="$(command -v python)"
          node --check tests/run_document_links_browser.mjs
          node tests/run_document_links_browser.mjs
      - name: Full offline Python, Node and browser regression
        env:
          EMAIL_ENABLED: '0'
          GOOGLE_PLACES_API_KEY: ''
          OPENAI_API_KEY: ''
          ADVICE_EVIDENCE_DIR: '${{ runner.temp }}/advice-preview'
          DOCUMENT_LINK_EVIDENCE_DIR: '${{ runner.temp }}/document-link-preview'
        run: |
          export CODEX_PRIMARY_RUNTIME_NODE_MODULES="$RUNNER_TEMP/comparison-browser/node_modules"
          export STAGE6_TEST_PYTHON="$(command -v python)"
          node --check static/enquiry_revenue.js
          node --check static/public_analytics.js
          node tests/test_revenue_attribution.mjs
          node tests/growth_batch2_events.mjs
          node --check static/app.js
          node --check static/city_account_prices.js
          node --check tests/run_local_browser.mjs
          node tests/test_material_selection.cjs
          node tests/test_trade_comparison.cjs
          node --test tests/test_batch8_browser_support.mjs
          node tests/test_lead_email.cjs
          python -B tests/run_stage6_local.py
      - name: Public Google review desktop, tablet and mobile matrix
        env:
          EMAIL_ENABLED: '0'
          GOOGLE_PLACES_API_KEY: ''
          OPENAI_API_KEY: ''
          PUBLIC_REVIEWS_EVIDENCE_DIR: '${{ runner.temp }}/public-review-preview'
        run: |
          export CODEX_PRIMARY_RUNTIME_NODE_MODULES="$RUNNER_TEMP/comparison-browser/node_modules"
          export STAGE6_TEST_PYTHON="$(command -v python)"
          node tests/run_public_reviews_browser.mjs
      - name: Save public review responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-review-responsive-previews
          path: ${{ runner.temp }}/public-review-preview
          if-no-files-found: error
      - name: Save approved article desktop and mobile previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-advice-previews
          path: ${{ runner.temp }}/advice-preview
          if-no-files-found: error
      - name: Save secure document-link desktop and mobile previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-document-link-previews
          path: ${{ runner.temp }}/document-link-preview
          if-no-files-found: error
